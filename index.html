<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>
    <div class="calculator">
        <!-- Bagian untuk menghapusRiwayat -->
        <div class="history-container">
            <div class="history-header">
                <h3>Riwayat Hasil</h3>
                <button id="clear-history" class="btn ctrl">Hapus Semua</button>
            </div>
            <ul id="history-list"></ul>
        </div>

        
        <div class="calculator-body">
            <!-- Tombol dark mode maupun light mode -->
            <button id="theme-toggle" class="theme-toggle">🌙 Mode Gelap</button>
            <button id="angle-toggle" class="theme-toggle small" aria-pressed="false">Rad</button>


            

            <!-- hasil input -->
            <div class="display-wrap">
                <input type="text" id="display" class="display" value="" readonly>
                <div id="display-result" class="display-result" aria-hidden="true"></div>
            </div>

            <!-- Tombol-tombol -->
            <div class="buttons">
                <button class="btn fn" data-value="sin(">sin</button>
                <button class="btn fn" data-value="cos(">cos</button>
                <button class="btn fn" data-value="tan(">tan</button>
                <button class="btn op" data-value="(">(</button>
                <button class="btn op" data-value=")">)</button>
                <button class="btn ctrl clear" data-value="C">C</button>
                <button class="btn ctrl backspace" data-value="←">←</button>
                <button class="btn op" data-value="%">%</button>
                <button class="btn num" data-value="7">7</button>
                <button class="btn num" data-value="8">8</button>
                <button class="btn num" data-value="9">9</button>
                <button class="btn op" data-value="/">/</button>
                <button class="btn num" data-value="4">4</button>
                <button class="btn num" data-value="5">5</button>
                <button class="btn num" data-value="6">6</button>
                <button class="btn op" data-value="*">*</button>
                <button class="btn num" data-value="1">1</button>
                <button class="btn num" data-value="2">2</button>
                <button class="btn num" data-value="3">3</button>
                <button class="btn num" data-value="0">0</button>
                <button class="btn op" data-value=".">.</button>
                <button class="btn op" data-value="^">^</button>
                <button class="btn equal" data-value="=">=</button>
            </div>
        </div>
    </div>

    <script src="kalkulator.js"></script>
</body>
</html>
